name: Keep Supabase Alive

on:
  schedule:
    # Läuft zweimal täglich um 08:00 und 20:00 UTC
    - cron: '0 7,20 * * *'
  # Ermöglicht das manuelle Starten zum Testen im GitHub-Tab "Actions"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Anfrage fehlgeschlagen!"
            exit 1
          fi
